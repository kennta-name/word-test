<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>インフラ用語クイズ | 新人エンジニア向け</title>
<style>
  :root{
    --bg:#ffffff;
    --bg-alt:#f5f5f7;
    --ink:#1d1d1f;
    --ink-soft:#6e6e73;
    --blue:#0071e3;
    --blue-hover:#0077ed;
    --blue-soft:#e8f2ff;
    --green:#1f9d55;
    --green-soft:#e6f7ec;
    --red:#e0342a;
    --red-soft:#fdeceb;
    --line:#d2d2d7;
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:12px;
    --shadow:0 20px 40px -20px rgba(0,0,0,0.18);
    --shadow-sm:0 8px 20px -12px rgba(0,0,0,0.15);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", sans-serif;
  }
 
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    font-family:var(--font);
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{ background:var(--blue-soft); color:var(--blue); }
 
  button{ font-family:inherit; }
 
  /* ---------- Nav ---------- */
  .nav{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 24px;
    background:rgba(255,255,255,0.72);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid rgba(0,0,0,0.06);
  }
  .nav-brand{
    display:flex; align-items:center; gap:8px;
    font-weight:600; font-size:15px; letter-spacing:-0.01em;
  }
  .nav-mark{
    width:22px; height:22px; border-radius:6px;
    background:linear-gradient(145deg,#0071e3,#00c6ff);
    display:inline-block;
  }
  .nav-stat{
    font-size:13px; color:var(--ink-soft);
  }
 
  /* ---------- Layout ---------- */
  .screen{ display:none; min-height:calc(100vh - 51px); }
  .screen.active{ display:block; animation:fadeIn .45s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
 
  .wrap{ max-width:720px; margin:0 auto; padding:0 24px; }
 
  /* ---------- Hero / Start ---------- */
  .hero{
    text-align:center;
    padding:96px 24px 64px;
    background:
      radial-gradient(circle at 18% 0%, #eaf5ff 0%, transparent 45%),
      radial-gradient(circle at 82% 10%, #eafff2 0%, transparent 40%),
      var(--bg);
  }
  .eyebrow{
    display:inline-block; font-size:13px; font-weight:600; color:var(--blue);
    background:var(--blue-soft); padding:6px 14px; border-radius:999px;
    letter-spacing:.02em; margin-bottom:20px;
  }
  .hero h1{
    font-size:clamp(34px,6vw,56px);
    line-height:1.08;
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0 0 18px;
  }
  .hero h1 span{
    background:linear-gradient(120deg,#0071e3,#00b4ff 60%,#1f9d55);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero p{
    font-size:18px; color:var(--ink-soft); max-width:520px; margin:0 auto 40px;
    line-height:1.6;
  }
 
  .spec-row{
    display:flex; justify-content:center; gap:14px; flex-wrap:wrap;
    margin-bottom:44px;
  }
  .spec-chip{
    background:var(--bg-alt); border-radius:999px; padding:10px 18px;
    font-size:14px; color:var(--ink); font-weight:500;
    display:flex; align-items:center; gap:8px;
  }
  .spec-chip b{ color:var(--blue); }
 
  .btn{
    appearance:none; border:none; cursor:pointer;
    border-radius:980px;
    font-weight:600; letter-spacing:-0.01em;
    transition:transform .15s ease, background .2s ease, box-shadow .2s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{
    background:var(--blue); color:#fff;
    font-size:17px; padding:16px 40px;
    box-shadow:0 12px 24px -10px rgba(0,113,227,0.55);
  }
  .btn-primary:hover{ background:var(--blue-hover); }
  .btn-secondary{
    background:var(--bg-alt); color:var(--ink);
    font-size:15px; padding:12px 26px;
  }
  .btn-secondary:hover{ background:#e8e8ed; }
  .btn-ghost{
    background:transparent; color:var(--blue);
    font-size:15px; padding:12px 20px; border:1.5px solid var(--blue-soft);
  }
  .btn-ghost:hover{ background:var(--blue-soft); }
  .btn-ghost.small{ font-size:13px; padding:8px 16px; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
 
  .cta-row{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
 
  /* Count selector */
  .panel{
    max-width:640px; margin:0 auto 32px; padding:28px;
    background:var(--bg-alt); border-radius:var(--radius-lg);
    text-align:left;
  }
  .panel h3{ margin:0 0 16px; font-size:15px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}
  .count-chips{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .count-chip{
    border:1.5px solid var(--line); background:#fff; color:var(--ink);
    border-radius:999px; padding:10px 18px; font-size:14px; font-weight:600;
    cursor:pointer; transition:all .15s ease;
  }
  .count-chip:hover{ border-color:var(--blue); }
  .count-chip.active{ background:var(--blue); border-color:var(--blue); color:#fff; }
  .count-hint{ text-align:center; font-size:13px; color:var(--ink-soft); margin-top:14px; }
 
  /* Stats panel on start screen */
  .panel-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .panel-stat b{ display:block; font-size:26px; font-weight:700; letter-spacing:-0.02em; }
  .panel-stat span{ font-size:13px; color:var(--ink-soft); }
 
  .weak-list{ margin-top:20px; display:flex; flex-wrap:wrap; gap:8px; }
  .weak-tag{
    background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:8px 12px; font-size:13px; display:flex; align-items:center; gap:6px;
  }
  .weak-tag b{ color:var(--red); font-weight:700; }
 
  .history-list{ margin-top:20px; display:flex; flex-direction:column; gap:8px; }
  .history-row{
    display:flex; justify-content:space-between; align-items:center;
    background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:10px 14px; font-size:13px;
  }
  .history-row .hr-date{ color:var(--ink-soft); }
  .history-row .hr-score{ font-weight:700; }
 
  /* ---------- Quiz screen ---------- */
  .quiz-shell{ padding:20px 24px 100px; }
 
  .quiz-topbar{
    display:flex; justify-content:flex-start; margin-bottom:18px;
  }
 
  .progress-track{
    height:6px; background:var(--bg-alt); border-radius:999px; overflow:hidden;
    margin-bottom:14px;
  }
  .progress-fill{
    height:100%; background:linear-gradient(90deg,#0071e3,#00c2ff);
    border-radius:999px; width:0%;
    transition:width .4s cubic-bezier(.4,0,.2,1);
  }
 
  .quiz-meta{
    display:flex; justify-content:space-between; align-items:center;
    font-size:13px; color:var(--ink-soft); margin-bottom:28px;
  }
  .quiz-meta .count{ font-weight:600; color:var(--ink); }
  .cat-badge{
    background:var(--blue-soft); color:var(--blue); font-weight:600;
    padding:5px 12px; border-radius:999px; font-size:12px;
  }
 
  .qtype-label{
    font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:10px;
  }
 
  .question-card{
    background:var(--bg-alt); border-radius:var(--radius-lg);
    padding:38px 32px; margin-bottom:28px;
    box-shadow:var(--shadow-sm);
  }
  .question-card p{
    font-size:clamp(20px,3.4vw,26px);
    font-weight:700; line-height:1.5; letter-spacing:-0.01em;
    margin:0;
  }
 
  .choices{ display:flex; flex-direction:column; gap:12px; }
  .choice{
    text-align:left;
    background:#fff; border:1.5px solid var(--line); border-radius:var(--radius-md);
    padding:18px 20px; font-size:16px; line-height:1.55; color:var(--ink);
    cursor:pointer; display:flex; gap:14px; align-items:flex-start;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .choice:hover{ border-color:var(--blue); background:var(--blue-soft); }
  .choice:active{ transform:scale(0.99); }
  .choice .idx{
    flex:0 0 auto; width:26px; height:26px; border-radius:50%;
    background:var(--bg-alt); color:var(--ink-soft);
    font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .choice.selected{ border-color:var(--blue); background:var(--blue-soft); }
  .choice.selected .idx{ background:var(--blue); color:#fff; }
 
  .quiz-footer{
    display:flex; justify-content:flex-end; margin-top:26px;
  }
 
  /* ---------- Result screen ---------- */
  .result-hero{
    text-align:center; padding:80px 24px 40px;
  }
  .score-ring{
    width:200px; height:200px; border-radius:50%; margin:0 auto 28px;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    background:conic-gradient(var(--blue) calc(var(--pct,0) * 1%), var(--bg-alt) 0);
    position:relative;
  }
  .score-ring::before{
    content:""; position:absolute; inset:14px; background:#fff; border-radius:50%;
  }
  .score-ring .pct{ position:relative; font-size:40px; font-weight:800; letter-spacing:-0.02em; }
  .score-ring .sub{ position:relative; font-size:13px; color:var(--ink-soft); }
 
  .result-headline{ font-size:26px; font-weight:700; margin:0 0 8px; letter-spacing:-0.01em; }
  .result-sub{ color:var(--ink-soft); font-size:16px; margin:0 0 36px; }
 
  .cat-breakdown{
    max-width:640px; margin:0 auto 40px; text-align:left;
  }
  .cat-row{ margin-bottom:16px; }
  .cat-row-top{ display:flex; justify-content:space-between; font-size:14px; margin-bottom:6px; }
  .cat-row-top b{ font-weight:600; }
  .cat-bar-track{ height:8px; background:var(--bg-alt); border-radius:999px; overflow:hidden; }
  .cat-bar-fill{ height:100%; background:var(--blue); border-radius:999px; }
 
  .review-section{ max-width:680px; margin:0 auto 60px; text-align:left; }
  .review-section h3{ font-size:20px; font-weight:700; margin:0 0 18px; }
  .review-empty{
    background:var(--green-soft); color:var(--green); border-radius:var(--radius-md);
    padding:22px; text-align:center; font-weight:600;
  }
  .review-item{
    border:1px solid var(--line); border-radius:var(--radius-md);
    padding:20px 22px; margin-bottom:14px;
  }
  .review-item.wrong{ border-color:rgba(224,52,42,0.35); }
  .review-item.correct{ border-color:rgba(31,157,85,0.3); }
  .review-item .rt{ font-size:12px; color:var(--ink-soft); margin-bottom:6px; display:flex; gap:8px; align-items:center;}
  .review-item .term{ font-size:17px; font-weight:700; margin-bottom:8px; }
  .review-item .meaning{ font-size:14.5px; line-height:1.65; color:var(--ink); margin-bottom:10px; }
  .review-item .beginner{
    font-size:13.5px; line-height:1.6; color:var(--ink-soft);
    background:var(--bg-alt); border-radius:10px; padding:12px 14px;
  }
  .review-item .your-answer{ font-size:13.5px; color:var(--red); margin-bottom:8px; }
  .result-tag{
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px;
  }
  .result-tag.correct{ background:var(--green-soft); color:var(--green); }
  .result-tag.wrong{ background:var(--red-soft); color:var(--red); }
 
  .result-actions{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; padding-bottom:70px; }
 
  footer{
    text-align:center; padding:30px; font-size:12.5px; color:var(--ink-soft);
    border-top:1px solid var(--line);
  }
 
  @media (max-width:600px){
    .hero{ padding:64px 20px 44px; }
    .panel-grid{ grid-template-columns:1fr 1fr; }
    .question-card{ padding:28px 22px; }
  }
</style>

<body>
 
<nav class="nav">
  <div class="nav-brand"><span class="nav-mark"></span>インフラ用語クイズ</div>
  <div class="nav-stat" id="navStat"></div>
</nav>
 
<!-- ============ START SCREEN ============ -->
<section class="screen active" id="screen-start">
  <div class="hero">
    <span class="eyebrow">新人エンジニア向け・全120問</span>
    <h1>現場の言葉を、<br><span>体で覚える。</span></h1>
    <p>障害対応・物理配線・SLAまで。先輩が当たり前のように使う用語を、4択クイズでテンポよく習得しましょう。</p>
 
    <div class="spec-row">
      <div class="spec-chip">問題数 <b>最大120問</b></div>
      <div class="spec-chip">形式 <b>4択</b></div>
      <div class="spec-chip">進捗 <b>自動保存</b></div>
    </div>
  </div>
 
  <div class="wrap">
    <div class="panel">
      <h3>出題数を選ぶ</h3>
      <div class="count-chips" id="countChips"></div>
      <p class="count-hint">10問単位で選べます（最大120問）</p>
    </div>
 
    <div class="cta-row" style="margin-bottom:40px;">
      <button class="btn btn-primary" id="btnStart">クイズをはじめる</button>
      <button class="btn btn-secondary" id="btnReviewWeak" style="display:none;">苦手だけ復習する</button>
    </div>
 
    <div class="panel" id="statsPanel" style="display:none;">
      <h3>これまでの記録</h3>
      <div class="panel-grid">
        <div class="panel-stat"><b id="statAttempts">0</b><span>挑戦回数</span></div>
        <div class="panel-stat"><b id="statBest">0%</b><span>最高正答率</span></div>
        <div class="panel-stat"><b id="statLast">0%</b><span>前回の正答率</span></div>
      </div>
      <div class="weak-list" id="weakList"></div>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>
</section>
 
<!-- ============ QUIZ SCREEN ============ -->
<section class="screen" id="screen-quiz">
  <div class="wrap quiz-shell">
    <div class="quiz-topbar">
      <button class="btn btn-ghost small" id="btnHomeFromQuiz">← ホームに戻る</button>
    </div>
 
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="quiz-meta">
      <span>問題 <span class="count" id="qCount">1</span> / <span id="qTotal">120</span></span>
      <span class="cat-badge" id="qCategory">分類</span>
    </div>
 
    <div class="qtype-label" id="qTypeLabel">この用語の意味として正しいものは?</div>
    <div class="question-card"><p id="qPrompt">用語がここに入ります</p></div>
 
    <div class="choices" id="choices"></div>
 
    <div class="quiz-footer">
      <button class="btn btn-primary" id="btnNext" disabled>次の問題へ</button>
    </div>
  </div>
</section>
 
<!-- ============ RESULT SCREEN ============ -->
<section class="screen" id="screen-result">
  <div class="result-hero">
    <div class="score-ring" id="scoreRing">
      <div class="pct" id="scorePct">0%</div>
      <div class="sub" id="scoreFrac">0 / 0</div>
    </div>
    <h2 class="result-headline" id="resultHeadline">お疲れさまでした</h2>
    <p class="result-sub" id="resultSub"></p>
  </div>
 
  <div class="wrap">
    <div class="cat-breakdown" id="catBreakdown"></div>
 
    <div class="review-section">
      <h3>解答結果一覧</h3>
      <div id="reviewList"></div>
    </div>
 
    <div class="result-actions">
      <button class="btn btn-primary" id="btnRetryWrong">間違えた問題だけ再挑戦</button>
      <button class="btn btn-secondary" id="btnRetryAll">最初からもう一度</button>
      <button class="btn btn-ghost" id="btnHome">トップに戻る</button>
    </div>
  </div>
</section>
 
<footer>社内学習用クイズアプリ &middot; 出題数はいつでも選び直せます</footer>
 
<script>
const ALL_QUESTIONS = [{"id": 1, "type": "term2meaning", "category": "SLA・契約", "term": "エスカレーション", "meaning": "自分の手に負えない障害が起きたとき、上の先輩や上司、専門チームに「助けてください！」と報告すること。", "beginner": "「これ以上は自分じゃ無理です！班長、お願いします！」と速やかにバトンを上に繋ぐ、超重要な危機管理行動。", "prompt": "エスカレーション", "choices": ["システムログ。機器やサーバが出力する動作記録。障害解析の重要な手がかり。", "災害や大規模障害発生時でも業務を継続するための計画。", "自分の手に負えない障害が起きたとき、上の先輩や上司、専門チームに「助けてください！」と報告すること。", "ラックに搭載する機器の高さを表す単位。1U＝約44.45mm。"], "answerIndex": 2}, {"id": 2, "type": "term2meaning", "category": "設計・運用", "term": "ワークアラウンド", "meaning": "根本解決ではないが、とりあえずシステムを動かし続けるための「暫定対処（応急処置）」。", "beginner": "配管から水漏れしたとき、元栓を直すのではなく、とりあえず「テープをグルグル巻きにして凌ぐ」技。", "prompt": "ワークアラウンド", "choices": ["根本解決ではないが、とりあえずシステムを動かし続けるための「暫定対処（応急処置）」。", "管理専用の別回線（アウトオブバンド）経由で、対象機器にPingを打つ疎通確認。", "障害検知時に、上位や対向機器に障害を伝えるため意図的にリンクを落とす機能。", "ポートが物理的にUP（リンク確立）しており、かつ管理上も有効（Enable）な正常状態。"], "answerIndex": 0}, {"id": 3, "type": "term2meaning", "category": "物理・配線", "term": "フリアク", "meaning": "フリーアクセス（フロア）の略。床下に配線スペースがある二重床構造。", "beginner": "床の下にケーブルを通せる「上げ底の床」。データセンターでは標準装備。", "prompt": "フリアク", "choices": ["ポートが物理的にUP（リンク確立）しており、かつ管理上も有効（Enable）な正常状態。", "フリーアクセス（フロア）の略。床下に配線スペースがある二重床構造。", "1芯の光ファイバーを送受信で共用する通信方式。波長を分けて双方向通信を行う。", "「最大限の努力はするけど、品質の保証はしないよ」という提供方式。一般的な家庭用ネット回線。"], "answerIndex": 1}, {"id": 4, "type": "meaning2term", "category": "設計・運用", "term": "サービスバックアウト", "meaning": "作業時に意図しなかった障害・不具合が発生した際、サービス正常復旧するよう早急に回避させること。", "beginner": "ネットワーク機器の設定変更後に通信断が発生したため、新設定を取り消して作業前の設定へ戻し、サービスを復旧させる対応。", "prompt": "作業時に意図しなかった障害・不具合が発生した際、サービス正常復旧するよう早急に回避させること。", "choices": ["サービスバックアウト", "RRH", "アラームマスク", "デフォルトゲートウェイ"], "answerIndex": 0}, {"id": 5, "type": "meaning2term", "category": "物理・配線", "term": "E-BTS", "meaning": "屋外用の基地局装置。電柱やビル屋上に設置される携帯電話の電波送受信設備。", "beginner": "街中で見かける携帯の基地局ボックス。ここから電波が飛んでスマホに届く。", "prompt": "屋外用の基地局装置。電柱やビル屋上に設置される携帯電話の電波送受信設備。", "choices": ["パッチパネル", "E-BTS", "線密（せんみつ）/ 配線整理", "msec"], "answerIndex": 1}, {"id": 6, "type": "meaning2term", "category": "設計・運用", "term": "バックアウト", "meaning": "切り戻しとほぼ同義。メンテナンスや更新作業で問題が発生した際に、元の状態に戻すこと。", "beginner": "「やっぱり前のバージョンに戻そう」という撤退作戦。深夜作業の命綱。", "prompt": "切り戻しとほぼ同義。メンテナンスや更新作業で問題が発生した際に、元の状態に戻すこと。", "choices": ["eNB", "バックアウト", "ケーブルストレス", "両系運用"], "answerIndex": 1}, {"id": 7, "type": "term2meaning", "category": "物理・配線", "term": "光モジュール", "meaning": "スイッチやルーターに装着し、電気信号と光信号を相互変換する装置（SFP、QSFPなど）。", "beginner": "スイッチと光ファイバーを接続するための通信インターフェース部品。電気信号を光信号へ変換して送受信する。", "prompt": "光モジュール", "choices": ["電気の流れる量。アンペア（A）で表す。", "スイッチやルーターに装着し、電気信号と光信号を相互変換する装置（SFP、QSFPなど）。", "difference（差分）の略。設定ファイルなどの変更前後の違いを比較・表示すること。", "光信号（光ファイバ）と電気信号（LANケーブル）を互いに変換する、手のひらサイズの四角い箱。"], "answerIndex": 1}, {"id": 8, "type": "meaning2term", "category": "構造・制御", "term": "Flush", "meaning": "スイッチのFDB（MACアドレステーブル）をクリアして、学習内容を初期化すること。", "beginner": "スイッチが保持しているMACアドレスの学習情報をすべて削除し、受信フレームをもとに接続先を再学習させる動作。", "prompt": "スイッチのFDB（MACアドレステーブル）をクリアして、学習内容を初期化すること。", "choices": ["RPO", "シングルファイバ", "Flush", "エージングタイム"], "answerIndex": 2}, {"id": 9, "type": "meaning2term", "category": "構造・制御", "term": "スタンドアローン", "meaning": "他の機器と連携せず、単独で動作している状態。または単体で完結する機器構成。", "beginner": "チームを組まず「一匹狼」で動いている状態。冗長化されていないことも多い。", "prompt": "他の機器と連携せず、単独で動作している状態。または単体で完結する機器構成。", "choices": ["MTTR", "SLA", "保守ベンダ", "スタンドアローン"], "answerIndex": 3}, {"id": 10, "type": "meaning2term", "category": "構造・制御", "term": "eNB", "meaning": "e-NodeB（イーノードビー）の略。LTE（4G）の基地局のこと。5GではgNBと呼ぶ。", "beginner": "4Gの携帯基地局の正式名称。5Gになると「gNB」に名前が変わる。", "prompt": "e-NodeB（イーノードビー）の略。LTE（4G）の基地局のこと。5GではgNBと呼ぶ。", "choices": ["eNB", "片通（かたづう）", "バースト", "RCA"], "answerIndex": 0}, {"id": 11, "type": "term2meaning", "category": "構造・制御", "term": "ラストワンマイル", "meaning": "最寄りの基地局・局舎から、ユーザーの自宅（終端）までの最後の区間のこと。", "beginner": "宅配便でいう「配送センターから、あなたのお家の玄関までの最後の配達路」。ここが一番コストがかかる。", "prompt": "ラストワンマイル", "choices": ["特定のアラーム（警告）を一時的に無視・非表示にする設定。メンテナンス中に使用。", "最寄りの基地局・局舎から、ユーザーの自宅（終端）までの最後の区間のこと。", "パケットの到着時間がばらつく現象。音声や映像品質に影響を与える。", "回線業者の装置を通さず、純粋に光ファイバの芯線だけをダイレクトに直借りする贅沢な構成。"], "answerIndex": 1}, {"id": 12, "type": "term2meaning", "category": "物理・配線", "term": "シングル構成", "meaning": "冗長化されていない単一構成。予備設備を持たない。", "beginner": "1台のルーターや1本の回線だけで構成されており、故障時の代替経路がない状態。", "prompt": "シングル構成", "choices": ["冗長化されていない単一構成。予備設備を持たない。", "Signal Detect（光信号受光状態）ではあるが、ポートは正常にリンクアップしていない状態。管理上は有効。", "エンドユーザーの端末（PC等）を接続するためのスイッチのポート。", "冗長構成の一方の系統が停止し、残る1系統のみでサービスを継続している状態。"], "answerIndex": 0}, {"id": 13, "type": "term2meaning", "category": "構造・制御", "term": "FAN", "meaning": "スイッチやルーター内部の熱を排出し、機器を適切な温度で動作させるための冷却装置。", "beginner": "高負荷で稼働するスイッチの熱を逃がし、装置がオーバーヒートしないようにするための冷却機構。", "prompt": "FAN", "choices": ["同じMACアドレスが異なるポートで検出され、FDBが更新される現象。", "スイッチやルーター内部の熱を排出し、機器を適切な温度で動作させるための冷却装置。", "ルーター等によって区切られた、同じIPアドレスのルールを持つ「1つのグループ（部屋）」。", "製品やサービスがメーカーから顧客に届くまでの取引経路・流通ルートのこと。誰が誰に売るかの関係性。"], "answerIndex": 1}, {"id": 14, "type": "meaning2term", "category": "設計・運用", "term": "冗長化（じょうちょうか）", "meaning": "壊れたときのために、機器や回線をあらかじめ2系統以上用意しておくこと。", "beginner": "「メインの道が崖崩れになってもいいように、あらかじめ回り道（迂回路）をセットで作っておく」思想。", "prompt": "壊れたときのために、機器や回線をあらかじめ2系統以上用意しておくこと。", "choices": ["冗長化（じょうちょうか）", "コールドスタンバイ", "C-RAN", "筐体冗長"], "answerIndex": 0}, {"id": 15, "type": "meaning2term", "category": "物理・配線", "term": "ラインカード（Linecard）", "meaning": "実際にデータの送受信を行うインターフェースカード（基板）。ポートが並んでいる部分。", "beginner": "機器の「手足」。LANケーブルや光ファイバを挿すポートがズラッと並んでいるカード。", "prompt": "実際にデータの送受信を行うインターフェースカード（基板）。ポートが並んでいる部分。", "choices": ["ラインカード（Linecard）", "RCA", "保守ベンダ", "ユニット（U）"], "answerIndex": 0}, {"id": 16, "type": "term2meaning", "category": "構造・制御", "term": "ルーター跨ぎ（またぎ）", "meaning": "通信が別のセグメント（異なるネットワークグループ）を超えて向こう側へ行くこと。", "beginner": "自分の市（ローカルな部屋）から、別の市（外の世界）へ移動すること。ルーティングが必要。", "prompt": "ルーター跨ぎ（またぎ）", "choices": ["通信が別のセグメント（異なるネットワークグループ）を超えて向こう側へ行くこと。", "RX（Receive）    対向装置から送られてきたデータを受け取る受信口。", "データ（パケット）の一部が途中で行方不明になり相手に届かないこと。", "壊れたときのために、機器や回線をあらかじめ2系統以上用意しておくこと。"], "answerIndex": 0}, {"id": 17, "type": "term2meaning", "category": "構造・制御", "term": "LLDP", "meaning": "Link Layer Discovery Protocolの略。隣接機器の情報を自動で収集するプロトコル。", "beginner": "「お隣さんは誰？」を自動で調べて教えてくれる便利な仕組み。CLIコマンドでもよく利用する。配線図作成に役立つ。", "prompt": "LLDP", "choices": ["シングルモード（SM）とマルチモード（MM）が代表的。距離や用途で使い分ける。", "システムが「壊れることなく、いつでも使える状態を維持できている度合い」。", "通信が切れていないか確認するため、定期的にお互い小さなデータを送り合う仕組み。", "Link Layer Discovery Protocolの略。隣接機器の情報を自動で収集するプロトコル。"], "answerIndex": 3}, {"id": 18, "type": "meaning2term", "category": "障害・品質", "term": "ハザーダス状態", "meaning": "冗長構成の一方の系統が故障・停止し、残る1系統のみでサービスを継続している警戒状態。残存系統に障害が発生するとサービス停止に直結する。", "beginner": "主系または従系が故障しており、シングル状態で通信を継続している状態。現在は正常に通信できているが、残る系統が故障すると即サービス断となる。", "prompt": "冗長構成の一方の系統が故障・停止し、残る1系統のみでサービスを継続している警戒状態。残存系統に障害が発生するとサービス停止に直結する。", "choices": ["商流", "セル", "ハザーダス状態", "SD/Disable"], "answerIndex": 2}, {"id": 19, "type": "meaning2term", "category": "SLA・契約", "term": "ベストエフォート", "meaning": "「最大限の努力はするけど、品質の保証はしないよ」という提供方式。一般的な家庭用ネット回線。", "beginner": "「渋滞がなければ30分で着くように頑張るけど、混んでたら遅れるから怒らないでね」というスタンス。", "prompt": "「最大限の努力はするけど、品質の保証はしないよ」という提供方式。一般的な家庭用ネット回線。", "choices": ["フラッピング", "LLDP", "ベストエフォート", "一次対応（いちじたいおう）"], "answerIndex": 2}, {"id": 20, "type": "meaning2term", "category": "設計・運用", "term": "インシデント", "meaning": "システムが正常に使えなくなっている（またはその原因となる）困った事態・イベント。", "beginner": "「事故の一歩手前」や「実際に起きているトラブル」。これを解決することが運用保守の仕事。", "prompt": "システムが正常に使えなくなっている（またはその原因となる）困った事態・イベント。", "choices": ["切り戻し（きりもどし）", "インシデント", "Down/Disable", "疎通確認（そつうかくにん）"], "answerIndex": 1}, {"id": 21, "type": "term2meaning", "category": "構造・制御", "term": "L3", "meaning": "Layer 3（レイヤー3）の略。ネットワーク層。IPアドレスでルーティングする層。", "beginner": "「IP住所」を使って、異なるネットワーク間でも通信できるようにする層。", "prompt": "L3", "choices": ["Signal Detect（光信号受光状態）ではあるが、管理上は無効（Disable）でポートは使用不可。", "信号が伝送路を通過する際に減衰して弱くなる現象。", "携帯電話の電波を送受信するアンテナ設備とその周辺機器一式。鉄塔やビル屋上にある。", "Layer 3（レイヤー3）の略。ネットワーク層。IPアドレスでルーティングする層。"], "answerIndex": 3}, {"id": 22, "type": "meaning2term", "category": "構造・制御", "term": "コアSW", "meaning": "ネットワークの中心に配置される大容量スイッチ。全体のトラフィックを集約する。", "beginner": "ネットワークの「心臓部」にある超高性能スイッチ。複数のエッジスイッチからの通信を集約し、ネットワーク全体のトラフィックを中継する基幹スイッチ。障害発生時の影響範囲が大きい。", "prompt": "ネットワークの中心に配置される大容量スイッチ。全体のトラフィックを集約する。", "choices": ["err-disable", "計画作業", "LAG", "コアSW"], "answerIndex": 3}, {"id": 23, "type": "term2meaning", "category": "構造・制御", "term": "オンプレ", "meaning": "オンプレミス（On-Premises）の略。自社でサーバやネットワーク機器を保有・運用する形態。", "beginner": "自分の家（自社）にサーバを置く方式。クラウドの反対。管理は大変だが自由度が高い。", "prompt": "オンプレ", "choices": ["ポートが物理的にUP（リンク確立）しており、かつ管理上も有効（Enable）な正常状態。", "オンプレミス（On-Premises）の略。自社でサーバやネットワーク機器を保有・運用する形態。", "パケットの到着時間がばらつく現象。音声や映像品質に影響を与える。", "Baseband Unitの略。基地局でデジタル信号を処理する装置。RRHとセットで使う。"], "answerIndex": 1}, {"id": 24, "type": "term2meaning", "category": "障害・品質", "term": "死活監視（しかつかんし）", "meaning": "対象のサーバーやネットワーク機器が「生きてるか死んでるか」を24時間体制で見守ること。", "beginner": "定期的に「生きてる？」と声をかけ（Ping送信）、返事があるか確認する基本の看病。", "prompt": "死活監視（しかつかんし）", "choices": ["光コネクタの一種（SC/APCコネクタ）の現場での俗称。緑色が目印。", "ネットワークの中心に配置される大容量スイッチ。全体のトラフィックを集約する。", "対象のサーバーやネットワーク機器が「生きてるか死んでるか」を24時間体制で見守ること。", "ポートが物理的にDOWN（リンク断）だが、管理上は有効（Enable）になっている状態。"], "answerIndex": 2}, {"id": 25, "type": "meaning2term", "category": "設計・運用", "term": "Ins", "meaning": "In Serviceの略。機器やポートがサービス中（稼働中）の状態。", "beginner": "「営業中」の状態。正常に通信を処理している。", "prompt": "In Serviceの略。機器やポートがサービス中（稼働中）の状態。", "choices": ["バックボーン（基幹回線）", "アラームマスク", "Ins", "SD/Enable"], "answerIndex": 2}, {"id": 26, "type": "term2meaning", "category": "物理・配線", "term": "ホットスワップ", "meaning": "電源を入れたまま（システムを稼働させたまま）パーツやハードディスクを安全に抜き差しすること。", "beginner": "走っている車のタイヤを、車を止めずにその場で新品に交換するようなハイテク技術。", "prompt": "ホットスワップ", "choices": ["機器やシステムを新しいものに入れ替える作業。または通信経路を別のルートに変えること。", "電源を入れたまま（システムを稼働させたまま）パーツやハードディスクを安全に抜き差しすること。", "障害検知後、まずはこれ以上被害が広がらないように、再起動や回線切替などを行う「応急処置」のこと。", "主系・予備系の両方が停止し、サービス提供できない状態。"], "answerIndex": 1}, {"id": 27, "type": "meaning2term", "category": "設計・運用", "term": "オンスケ", "meaning": "オンスケジュールの略。プロジェクトや作業が予定通りに進んでいる状態。", "beginner": "「進捗どうですか？」「オンスケです！」は現場で最も安心できる返答。", "prompt": "オンスケジュールの略。プロジェクトや作業が予定通りに進んでいる状態。", "choices": ["建設", "ピコセル", "オンスケ", "スタンドアローン"], "answerIndex": 2}, {"id": 28, "type": "term2meaning", "category": " const STORAGE_KEY = 'infraQuizHistory_v1';
const MAX_HISTORY = 5;
const MAX_QUESTIONS = ALL_QUESTIONS.length;
 
function loadHistory(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return { attempts: [], missed: {} };
    const parsed = JSON.parse(raw);
    return { attempts: parsed.attempts || [], missed: parsed.missed || {} };
  }catch(e){ return { attempts: [], missed: {} }; }
}
function saveHistory(h){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(h)); }catch(e){}
}
 
let history = loadHistory();
let selectedCount = Math.min(30, MAX_QUESTIONS);
 
let state = {
  queue: [],
  index: 0,
  score: 0,
  wrong: [],
  answers: [],
  currentOrder: null,
  selectedOptionIndex: null,
};
 
const screens = {
  start: document.getElementById('screen-start'),
  quiz: document.getElementById('screen-quiz'),
  result: document.getElementById('screen-result'),
};
function showScreen(name){
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
}
 
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
 
/* ---------- Count selector ---------- */
function renderCountChips(){
  const el = document.getElementById('countChips');
  el.innerHTML = '';
  for(let n = 10; n <= MAX_QUESTIONS; n += 10){
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'count-chip' + (n === selectedCount ? ' active' : '');
    chip.textContent = n + '問';
    chip.addEventListener('click', () => {
      selectedCount = n;
      Array.from(el.children).forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
    });
    el.appendChild(chip);
  }
  // 端数（120が10の倍数でない場合の保険）
  if(MAX_QUESTIONS % 10 !== 0){
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'count-chip' + (MAX_QUESTIONS === selectedCount ? ' active' : '');
    chip.textContent = MAX_QUESTIONS + '問（全問）';
    chip.addEventListener('click', () => {
      selectedCount = MAX_QUESTIONS;
      Array.from(el.children).forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
    });
    el.appendChild(chip);
  }
}
 
/* ---------- Start screen stats ---------- */
function renderStartStats(){
  const nav = document.getElementById('navStat');
  const panel = document.getElementById('statsPanel');
  const btnWeak = document.getElementById('btnReviewWeak');
 
  if(history.attempts.length === 0){
    panel.style.display = 'none';
    nav.textContent = '';
    btnWeak.style.display = 'none';
    return;
  }
  panel.style.display = 'block';
  const attempts = history.attempts;
  const best = Math.max(...attempts.map(a=>a.accuracy));
  const last = attempts[attempts.length-1].accuracy;
  document.getElementById('statAttempts').textContent = attempts.length;
  document.getElementById('statBest').textContent = best + '%';
  document.getElementById('statLast').textContent = last + '%';
  nav.textContent = `前回 ${last}% / 直近${attempts.length}回分の記録`;
 
  const weakEntries = Object.entries(history.missed)
    .sort((a,b)=>b[1]-a[1]).slice(0,6);
  const weakList = document.getElementById('weakList');
  weakList.innerHTML = '';
  if(weakEntries.length){
    weakEntries.forEach(([term,count])=>{
      const tag = document.createElement('div');
      tag.className = 'weak-tag';
      tag.innerHTML = `${term} <b>×${count}</b>`;
      weakList.appendChild(tag);
    });
    btnWeak.style.display = 'inline-block';
  } else {
    btnWeak.style.display = 'none';
  }
 
  const historyList = document.getElementById('historyList');
  historyList.innerHTML = '';
  attempts.slice().reverse().forEach(a => {
    const row = document.createElement('div');
    row.className = 'history-row';
    const d = new Date(a.date);
    const dateStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    row.innerHTML = `<span class="hr-date">${dateStr}</span><span class="hr-score">${a.score} / ${a.total}（${a.accuracy}%）</span>`;
    historyList.appendChild(row);
  });
}
 
/* ---------- Quiz flow ---------- */
function startQuiz(questionSet, countOverride){
  const n = countOverride || Math.min(selectedCount, questionSet.length);
  const pool = shuffle(questionSet);
  state = {
    queue: pool.slice(0, n),
    index: 0,
    score: 0,
    wrong: [],
    answers: [],
    currentOrder: null,
    selectedOptionIndex: null,
  };
  document.getElementById('qTotal').textContent = state.queue.length;
  showScreen('quiz');
  renderQuestion();
}
 
function renderQuestion(){
  const q = state.queue[state.index];
  state.currentOrder = null;
  state.selectedOptionIndex = null;
 
  document.getElementById('qCount').textContent = state.index + 1;
  document.getElementById('qCategory').textContent = q.category;
  document.getElementById('qTypeLabel').textContent =
    q.type === 'term2meaning'
      ? 'この用語の意味として正しいものはどれ?'
      : 'この説明が指す用語として正しいものはどれ?';
  document.getElementById('qPrompt').textContent = q.prompt;
 
  const pct = (state.index / state.queue.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
 
  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  const order = shuffle(q.choices.map((text,i)=>({text, isCorrect: i===q.answerIndex})));
  state.currentOrder = order;
 
  order.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.innerHTML = `<span class="idx">${String.fromCharCode(65+i)}</span><span>${escapeHtml(opt.text)}</span>`;
    btn.addEventListener('click', () => selectChoice(i));
    choicesEl.appendChild(btn);
  });
 
  document.getElementById('btnNext').disabled = true;
}
 
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
 
function selectChoice(i){
  state.selectedOptionIndex = i;
  const buttons = Array.from(document.getElementById('choices').children);
  buttons.forEach((b, idx) => b.classList.toggle('selected', idx === i));
  document.getElementById('btnNext').disabled = false;
}
 
document.getElementById('btnNext').addEventListener('click', () => {
  if(state.selectedOptionIndex === null) return;
 
  const q = state.queue[state.index];
  const order = state.currentOrder;
  const chosen = order[state.selectedOptionIndex];
  const correctOpt = order.find(o => o.isCorrect);
  const isCorrect = !!chosen.isCorrect;
 
  if(isCorrect){ state.score++; } else { state.wrong.push(q); }
 
  state.answers.push({
    q,
    chosenText: chosen.text,
    correctText: correctOpt.text,
    isCorrect,
  });
 
  state.index++;
  if(state.index >= state.queue.length){
    finishQuiz();
  } else {
    renderQuestion();
  }
});
 
document.getElementById('btnHomeFromQuiz').addEventListener('click', () => {
  if(state.queue.length && state.index < state.queue.length){
    const ok = window.confirm('進行中のクイズを終了してホームに戻りますか？（この回の記録は保存されません）');
    if(!ok) return;
  }
  showScreen('start');
  renderStartStats();
});
 
function finishQuiz(){
  const total = state.queue.length;
  const correct = state.score;
  const accuracy = Math.round((correct/total)*100);
 
  history.attempts.push({ date: new Date().toISOString(), score: correct, total, accuracy });
  if(history.attempts.length > MAX_HISTORY) history.attempts = history.attempts.slice(-MAX_HISTORY);
 
  state.wrong.forEach(q => {
    history.missed[q.term] = (history.missed[q.term] || 0) + 1;
  });
  saveHistory(history);
 
  document.getElementById('scoreRing').style.setProperty('--pct', accuracy);
  document.getElementById('scorePct').textContent = accuracy + '%';
  document.getElementById('scoreFrac').textContent = `${correct} / ${total} 問正解`;
 
  let headline, sub;
  if(accuracy >= 90){ headline = 'お見事、即戦力レベルです'; sub = '現場の会話にもう迷わずついていけます。'; }
  else if(accuracy >= 70){ headline = 'いい調子です'; sub = 'あと少しで用語に迷わなくなります。'; }
  else if(accuracy >= 40){ headline = '基礎が固まってきています'; sub = '間違えた問題を中心に復習しましょう。'; }
  else { headline = 'ここからが伸びしろです'; sub = '焦らず、間違えた問題から潰していきましょう。'; }
  document.getElementById('resultHeadline').textContent = headline;
  document.getElementById('resultSub').textContent = sub;
 
  renderCategoryBreakdown();
  renderResultsList();
 
  showScreen('result');
  renderStartStats();
}
 
function renderCategoryBreakdown(){
  const byCat = {};
  state.answers.forEach(a => {
    const cat = a.q.category;
    byCat[cat] = byCat[cat] || { total:0, correct:0 };
    byCat[cat].total++;
    if(a.isCorrect) byCat[cat].correct++;
  });
 
  const el = document.getElementById('catBreakdown');
  el.innerHTML = '';
  Object.entries(byCat).forEach(([cat, v]) => {
    const pct = Math.round((v.correct/v.total)*100);
    const row = document.createElement('div');
    row.className = 'cat-row';
    row.innerHTML = `
      <div class="cat-row-top"><b>${escapeHtml(cat)}</b><span>${v.correct} / ${v.total}（${pct}%）</span></div>
      <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${pct}%;"></div></div>
    `;
    el.appendChild(row);
  });
}
 
function renderResultsList(){
  const el = document.getElementById('reviewList');
  el.innerHTML = '';
  state.answers.forEach((a, i) => {
    const q = a.q;
    const item = document.createElement('div');
    item.className = 'review-item ' + (a.isCorrect ? 'correct' : 'wrong');
    item.innerHTML = `
      <div class="rt">
        <span class="cat-badge">${escapeHtml(q.category)}</span>
        <span class="result-tag ${a.isCorrect ? 'correct' : 'wrong'}">${a.isCorrect ? '正解' : '不正解'}</span>
        <span>問題 ${i+1}</span>
      </div>
      <div class="term">${escapeHtml(q.prompt)}</div>
      ${a.isCorrect ? '' : `<div class="your-answer">あなたの回答: ${escapeHtml(a.chosenText)}</div>`}
      <div class="meaning"><b>${escapeHtml(q.term)}</b>：${escapeHtml(q.meaning)}</div>
      <div class="beginner">${escapeHtml(q.beginner)}</div>
    `;
    el.appendChild(item);
  });
}
 
/* ---------- Buttons ---------- */
document.getElementById('btnStart').addEventListener('click', () => startQuiz(ALL_QUESTIONS));
document.getElementById('btnReviewWeak').addEventListener('click', () => {
  const weakTerms = new Set(Object.keys(history.missed));
  const set = ALL_QUESTIONS.filter(q => weakTerms.has(q.term));
  if(set.length){ startQuiz(set, set.length); } else { startQuiz(ALL_QUESTIONS); }
});
document.getElementById('btnRetryWrong').addEventListener('click', () => {
  if(state.wrong.length === 0){ startQuiz(ALL_QUESTIONS); return; }
  startQuiz(state.wrong, state.wrong.length);
});
document.getElementById('btnRetryAll').addEventListener('click', () => startQuiz(ALL_QUESTIONS));
document.getElementById('btnHome').addEventListener('click', () => { showScreen('start'); renderStartStats(); });
 
renderCountChips();
renderStartStats();
</script>
